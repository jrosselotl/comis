<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Proyecto - Parámetros</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div style="display: flex;">
        <!-- Sidebar -->
        <aside style="width: 220px; background-color: #f4f4f4; padding: 1rem; height: 100vh;">
            <h3>Panel Proyecto</h3>
            <ul>
                <li>
                    Parámetros Técnicos
                    <ul>
                        <li><a href="#" onclick="mostrarSeccion('parametros_asignar')">Asignar</a></li>
                        <li><a href="#" onclick="mostrarSeccion('parametros_ver')">Ver Parámetros</a></li>
                    </ul>
                </li>
                <li><a href="/logout">Cerrar sesión</a></li>
            </ul>
        </aside>

        <!-- Contenido -->
        <main style="flex-grow: 1; padding: 2rem;">
            <!-- Asignar Parámetros -->
            <section id="parametros_asignar" style="display: block;">
                <h2>Asignar Parámetros Técnicos</h2>
                <form id="parametros-form">
                    <label for="test">Tipo de Test:</label>
                    <select id="test" name="test">
                        <option value="continuidad">Continuidad</option>
                        <option value="megado">Megado</option>
                    </select>

                    <label for="ubicacion_1">Ubicación 1:</label>
                    <select name="ubicacion_1" id="ubicacion_1">
                        <option value="">Seleccione</option>
                          <option value="COLO">COLO</option>
                          <option value="WTP">WTP</option>
                          <option value="ADMIN">ADMIN</option>
                    </select>

                    <label for="ubicacion_2">Ubicación 2:</label>
                    <select name="ubicacion_2" id="ubicacion_2">
                        <option value="CE">CE</option>
                    </select>

                    <label for="tipo_equipo">Tipo de Equipo:</label>
                    <select name="tipo_equipo" id="tipo_equipo">
                          <option value="">Seleccione</option>
                          <option value="MSB">MSB</option>
                          <option value="PDU">PDU</option>
                          <option value="LBP">LBP</option>
                          <option value="ADP">ADP</option>
                          <option value="PNL">PNL</option>
                          <option value="NLP">NLP</option>
                          <option value="ATS">ATS</option>
                    </select>

                    <label for="sub_equipo">Sub Equipo:</label>
                    <select name="sub_equipo" id="sub_equipo">
                        <option value="FCB">FCB</option>
                        <option value="MCB">MCB</option>
                    </select>

                    <label for="valor_minimo">Valor mínimo:</label>
                    <input type="number" step="any" name="valor_minimo" id="valor_minimo">

                    <label for="valor_maximo">Valor máximo:</label>
                    <input type="number" step="any" name="valor_maximo" id="valor_maximo">

                    <label for="unidad">Unidad:</label>
                    <input type="text" name="unidad" id="unidad">

                    <label for="voltaje_requerido">Voltaje requerido:</label>
                    <input type="number" step="any" name="voltaje_requerido" id="voltaje_requerido">

                    <label for="observaciones">Observaciones:</label>
                    <textarea name="observaciones" id="observaciones"></textarea>

                    <button type="submit">Guardar Parámetro</button>
                </form>
            </section>

            <!-- Ver Parámetros -->
            <section id="parametros_ver" style="display: none;">
                <h2>Parámetros Existentes</h2>
                <table border="1" id="tabla-parametros">
                    <thead>
                        <tr>
                            <th>Ubicación 1</th>
                            <th>Ubicación 2</th>
                            <th>Tipo</th>
                            <th>Sub</th>
                            <th>Valor Min</th>
                            <th>Valor Max</th>
                            <th>Unidad</th>
                            <th>Voltaje</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        function mostrarSeccion(id) {
            document.getElementById("parametros_asignar").style.display = "none";
            document.getElementById("parametros_ver").style.display = "none";
            document.getElementById(id).style.display = "block";
        }
    </script>
    <script src="/static/js/admin_panel.js"></script>
</body>
</html>
