<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Pruebas Eléctricas</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Panel</h2>
    <button id="btn-dashboard">📊 Dashboard</button>
    <button id="btn-mytests">📂 My Tests</button>
    <button id="btn-newtest">➕ New Test</button>
    <a href="/logout" class="logout-btn">Cerrar Sesión</a>
  </div>

  <!-- Contenido principal -->
  <div class="content">
    <!-- Dashboard -->
    <div id="section-dashboard">
      <h2>Estadísticas de Pruebas</h2>
      <canvas id="grafico-tests" width="400" height="200"></canvas>
    </div>

    <!-- My Tests -->
    <div id="section-mytests" class="hidden">
      <h2>Mis Tests</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Equipo</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-mytests"></tbody>
      </table>
    </div>

    <!-- New Test -->
    <div id="section-newtest" class="hidden">
      <form id="formulario-pruebas" enctype="multipart/form-data">
        <!-- Paso 1 -->
        <fieldset>
          <legend>1. Datos del Equipo</legend>

          <label>Proyecto:
            <select id="proyecto_id" name="proyecto_id" required></select>
          </label>

          <label>Ubicación Principal:
            <div class="field-group">
              <select id="ubicacion_1" name="ubicacion_1" required>
                <option value="">Seleccione</option>
              </select>
              <select id="numero_ubicacion_1" name="numero_ubicacion_1" required>
                <option value="">Seleccione Nº</option>
              </select>
            </div>
          </label>

          <div id="label-ubicacion_2" style="display:none;">
            <label>Ubicación secundaria:</label>
            <div class="field-group">
              <select id="ubicacion_2" name="ubicacion_2"></select>
              <select id="numero_ubicacion_2" name="numero_ubicacion_2">
                <option value="">Seleccione Nº</option>
              </select>
            </div>
          </div>

          <label>Tipo de equipo:
            <div class="field-group">
              <select id="tipo_equipo" name="tipo_equipo" required></select>
              <select id="numero_tipo_equipo" name="numero_tipo_equipo" required>
                <option value="">Seleccione Nº</option>
              </select>
            </div>
          </label>

          <div id="label-sub_equipo" style="display:none;">
            <label>Sub-equipo:</label>
            <div class="field-group">
              <select id="sub_equipo" name="sub_equipo"></select>
              <select id="numero_sub_equipo" name="numero_sub_equipo">
                <option value="">Seleccione Nº</option>
              </select>
            </div>
          </div>

          <label>Terminal:
            <input type="text" id="terminal" name="terminal" placeholder="Nº Terminal" />
          </label>
        </fieldset>

        <!-- Paso 2 -->
        <fieldset>
          <legend>2. Tipo de prueba</legend>
          <label>Tipo de prueba:
            <select id="tipo-prueba" name="tipo_prueba" required>
              <option value="">Seleccione prueba...</option>
            </select>
          </label>
        </fieldset>

        <!-- Paso 3 -->
        <fieldset id="bloque-caracteristicas" style="display:none;">
          <legend>3. Características</legend>
          <label for="cable_sets">Cable Sets:
            <input type="number" id="cable_sets" name="cable_sets" min="1" value="1" required />
          </label>
          <label>Tipo de alimentación:
            <select id="tipo_alimentacion" name="tipo_alimentacion" required>
              <option value="trifasica">Trifásica (L1, L2, L3, N, PE)</option>
              <option value="monofasica">Monofásica (L, N, PE)</option>
            </select>
          </label>
          <label id="label-unidad" style="display:block;">Unidad:
            <select id="unidad" name="unidad" required>
              <option value="">Seleccione unidad...</option>
            </select>
          </label>
        </fieldset>

        <!-- Paso 4 -->
        <fieldset id="bloque-resultados" style="display:none;">
          <legend>4. Resultados de la prueba</legend>
          <div id="contenedor-resultados"></div>
        </fieldset>

        <button type="submit" class="btn-guardar">Guardar</button>
        <button type="button" id="btn-enviar-pdf" class="btn-enviar hidden">Enviar PDF</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/formulario_continuidad.js"></script>
  <script src="/static/js/formulario_megado.js"></script>
  <script src="/static/js/formulario_contact_resistance.js"></script>
  <script src="/static/js/formulario_torque.js"></script>
  <script src="/static/js/cargar_formulario.js"></script>
  <script src="/static/js/unidades_por_test.js"></script>
</body>
</html>
